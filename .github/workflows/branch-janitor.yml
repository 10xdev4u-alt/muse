name: Branch janitor

on:
  schedule:
    - cron: '17 4 * * *' # daily, off the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Delete remote branches merged over 7 days ago
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const b of branches) {
              if (b.name === context.repo.default_branch) continue;
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: b.commit.sha,
              });
              const merged = prs.find(p => p.merged_at);
              if (!merged) continue;
              if (new Date(merged.merged_at).getTime() < cutoff) {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${b.name}`,
                });
                console.log(`deleted ${b.name} (merged ${merged.merged_at})`);
              }
            }
