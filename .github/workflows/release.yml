name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk muse-${{ github.ref_name }}-debug.apk

      - name: Create draft release with APK
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: muse-${{ github.ref_name }}-debug.apk
          body: |
            Debug build of ${{ github.ref_name }}.
            Install: sideload the APK, then open Mind once on Wi-Fi to fetch the model.
